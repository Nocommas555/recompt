[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recompt"
version = "0.1.0"
description = "Find a project's build instructions and build it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "platformdirs>=4",
]

[project.optional-dependencies]
claude = ["anthropic>=2.13"]
ollama = ["ollama>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
recompt = "recompt.cli:main"

[tool.setuptools.packages.find]
include = ["recompt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not container and not llm and not benchmark'"
markers = [
    "integration: builds real projects or uses the network",
    "container: needs Podman or Docker",
    "llm: needs Claude credentials or a local Ollama server",
    "benchmark: runs the benchmark repository set",
]
